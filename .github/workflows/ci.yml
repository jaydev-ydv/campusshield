name: CI

on:
  push:
    branches: [main]
  pull_request:

# A cancelled superseded run frees the runner for the newer push immediately,
# rather than the two queuing behind each other.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    # Real PostgreSQL, not sqlite and not mocked — this project's own testing
    # philosophy (see tests/conftest.py) is non-negotiable about that, and CI
    # exercising anything else would verify a different application.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/campusshield_ci
      TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/campusshield_ci_test
      AUTH_PROVIDER: dev
      AUDIT_IP_PEPPER: ci-pepper-not-secret
      REPORT_TOKEN_PEPPER: ci-pepper-not-secret
      # tests/conftest.py's database_url fixture shells out to dropdb/createdb
      # with no explicit -h/-U flags — it depends on these to reach the
      # Postgres service container over TCP rather than a local Unix socket
      # that does not exist on this runner.
      PGHOST: localhost
      PGPORT: "5432"
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: |
            requirements-db.txt
            backend/requirements.txt

      - name: Install PostgreSQL client
        # backend/tests/conftest.py's database_url fixture shells out to
        # dropdb/createdb itself, once per test run — not assumed present on
        # the runner image.
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends postgresql-client

      - name: Install dependencies
        run: pip install -r requirements-db.txt -r backend/requirements.txt

      - name: Create CI database
        run: psql -c "CREATE DATABASE campusshield_ci;"

      - name: Apply migrations
        run: alembic upgrade head

      - name: ruff check
        working-directory: backend
        run: ruff check .

      - name: ruff format --check
        working-directory: backend
        run: ruff format --check .

      - name: mypy
        working-directory: backend
        run: mypy app/

      - name: pytest
        working-directory: backend
        run: pytest

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: typecheck
        working-directory: frontend
        run: npm run typecheck

      - name: lint
        working-directory: frontend
        run: npm run lint

      - name: format check
        working-directory: frontend
        run: npm run format:check

      - name: test
        working-directory: frontend
        run: npm test

      - name: build
        working-directory: frontend
        run: npm run build
