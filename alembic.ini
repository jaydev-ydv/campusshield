# CampusShield — Alembic configuration
#
# The connection URL is deliberately NOT set here.  migrations/env.py resolves it
# from the DATABASE_URL environment variable (or a Flask app config once the
# backend exists), so no credential ever lands in a tracked file.

[alembic]
script_location = migrations
prepend_sys_path = .
version_path_separator = os

# Migration filenames get a zero-padded sequence prefix so `ls versions/` reads
# in apply order.  Revision ids themselves stay explicit (0001, 0002, ...).
file_template = %%(rev)s_%%(slug)s

# Timestamps in migration headers use UTC.
timezone = UTC

[post_write_hooks]
# none configured

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
